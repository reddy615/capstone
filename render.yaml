services:
  - type: web
    name: relieflink
    runtime: node
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: AI_SERVICE_HOST
        value: 127.0.0.1
      - key: AI_SERVICE_PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RELIEFLINK_ADMIN_EMAIL
        sync: false
      - key: RELIEFLINK_ADMIN_PASSWORD
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false